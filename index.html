<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DREAD PICK — Horror Movie Randomizer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0a0a0a; --fg: #e8e0d6; --muted: #6b5e52;
    --accent: #c41e1e; --accent-glow: #ff2222;
    --card: #141010; --card-hover: #1e1616;
    --border: #2a1e1e; --blood: #8b0000;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; overflow-x: hidden; }
  .font-creep { font-family: 'Creepster', cursive; }
  #fogCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  @keyframes flicker { 0%,100%{opacity:1}3%{opacity:.85}6%{opacity:1}7.5%{opacity:.9}9%{opacity:1}50%{opacity:1}52%{opacity:.88}53%{opacity:1} }
  .flicker { animation: flicker 4s infinite; }
  @keyframes glitch { 0%{transform:translate(0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}100%{transform:translate(0)} }
  .glitch-active { animation: glitch 0.15s linear infinite; }
  @keyframes drip { 0%{height:0;opacity:0}10%{opacity:1}100%{height:80px;opacity:.6} }
  .blood-drip { position:absolute;width:3px;background:linear-gradient(to bottom,var(--accent),transparent);border-radius:0 0 50% 50%;animation:drip 3s ease-in infinite; }
  @keyframes pulseGlow { 0%,100%{box-shadow:0 0 20px rgba(196,30,30,.3),0 0 60px rgba(196,30,30,.1)}50%{box-shadow:0 0 40px rgba(196,30,30,.6),0 0 100px rgba(196,30,30,.2)} }
  .btn-dread { animation: pulseGlow 2.5s ease-in-out infinite; transition: all 0.3s ease; }
  .btn-dread:hover { animation:none;box-shadow:0 0 50px rgba(255,34,34,.7),0 0 120px rgba(255,34,34,.3);transform:scale(1.05); }
  .btn-dread:active { transform: scale(0.97); }
  @keyframes cardReveal { 0%{transform:scale(.7) rotateY(90deg);opacity:0}50%{transform:scale(1.05) rotateY(-5deg);opacity:1}100%{transform:scale(1) rotateY(0);opacity:1} }
  .card-reveal { animation: cardReveal 0.8s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes shake { 0%,100%{transform:translateX(0)}10%{transform:translateX(-8px)}20%{transform:translateX(8px)}30%{transform:translateX(-6px)}40%{transform:translateX(6px)}50%{transform:translateX(-4px)}60%{transform:translateX(4px)}70%{transform:translateX(-2px)}80%{transform:translateX(2px)} }
  .shake { animation: shake 0.6s ease-in-out; }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.8}90%{opacity:.8}100%{transform:translateY(-100vh) rotate(720deg);opacity:0} }
  .particle { position:fixed;width:2px;height:2px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:1; }
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--blood);border-radius:3px}
  .chip { transition: all 0.25s ease; cursor: pointer; user-select: none; }
  .chip:hover { background: var(--card-hover); border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  @keyframes shimmer { 0%{background-position:-200% 0}100%{background-position:200% 0} }
  .poster-shimmer { background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.03) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 3s infinite; }
  .star-filled { color: var(--accent); } .star-empty { color: var(--border); }
  @keyframes toastIn { 0%{transform:translateY(100px);opacity:0}100%{transform:translateY(0);opacity:1} }
  @keyframes toastOut { 0%{transform:translateY(0);opacity:1}100%{transform:translateY(100px);opacity:0} }
  .toast-enter { animation: toastIn 0.4s ease forwards; } .toast-exit { animation: toastOut 0.4s ease forwards; }
  .vignette { position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%); }
  .scanlines { position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px); }
  .history-item { transition: all 0.2s ease; } .history-item:hover { background: var(--card-hover); border-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important; } }
  @media (max-width: 768px) { .movie-card-grid { grid-template-columns: 1fr !important; } }
</style>
</head>
<body>
<canvas id="fogCanvas"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>
<div id="bloodDrips" class="fixed top-0 left-0 w-full h-0 z-10 pointer-events-none"></div>
<div id="particles" class="fixed inset-0 pointer-events-none z-10"></div>
<div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center"></div>

<div class="relative z-10 min-h-screen flex flex-col">
  <header class="relative py-8 px-4 text-center">
    <div class="relative inline-block">
      <h1 class="font-creep text-6xl md:text-8xl tracking-wider flicker" style="color: var(--accent);">DREAD PICK</h1>
      <h1 class="font-creep text-6xl md:text-8xl tracking-wider absolute top-0 left-0 opacity-70" style="color:#ff0000;clip-path:inset(0 0 65% 0);" aria-hidden="true">DREAD PICK</h1>
      <h1 class="font-creep text-6xl md:text-8xl tracking-wider absolute top-0 left-0 opacity-70" style="color:var(--accent);clip-path:inset(65% 0 0 0);" aria-hidden="true">DREAD PICK</h1>
    </div>
    <p class="mt-3 text-sm md:text-base tracking-widest uppercase" style="color: var(--muted);">Your nightmare awaits below</p>
    <div class="mx-auto mt-6 w-48 h-px" style="background:linear-gradient(to right,transparent,var(--accent),transparent);"></div>
  </header>

  <main class="flex-1 px-4 md:px-8 max-w-6xl mx-auto w-full pb-16">
    <section class="mb-8" aria-label="Movie filters">
      <div class="flex items-center gap-2 mb-4">
        <i class="fas fa-filter text-xs" style="color: var(--muted);"></i>
        <span class="text-xs uppercase tracking-widest" style="color: var(--muted);">Filter your doom</span>
      </div>
      <div class="mb-4">
        <span class="text-xs uppercase tracking-wider mb-2 block" style="color: var(--muted);">Subgenre</span>
        <div id="genreChips" class="flex flex-wrap gap-2" role="group" aria-label="Subgenre filters"></div>
      </div>
      <div class="mb-4">
        <span class="text-xs uppercase tracking-wider mb-2 block" style="color: var(--muted);">Decade</span>
        <div id="decadeChips" class="flex flex-wrap gap-2" role="group" aria-label="Decade filters"></div>
      </div>
      <div class="mb-2">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs uppercase tracking-wider" style="color: var(--muted);">Minimum Rating</span>
          <span id="ratingValue" class="text-sm font-bold" style="color: var(--accent);">5.0</span>
        </div>
        <input type="range" id="ratingSlider" min="3" max="9" step="0.5" value="5" class="w-full h-1 rounded-full appearance-none cursor-pointer" style="background:linear-gradient(to right,var(--accent),var(--border));" aria-label="Minimum rating filter">
      </div>
    </section>

    <section class="text-center mb-10">
      <button id="randomizeBtn" class="btn-dread font-creep text-3xl md:text-4xl px-12 py-5 rounded-lg border-2 cursor-pointer" style="background:var(--card);border-color:var(--accent);color:var(--fg);" aria-label="Randomize a horror movie">
        <i class="fas fa-skull-crossbones mr-3"></i>CONJURE A FILM
      </button>
      <p class="mt-3 text-xs" style="color: var(--muted);"><span id="availableCount">0</span> nightmares in the vault</p>
    </section>

    <section id="resultSection" class="mb-12 hidden" aria-label="Randomized movie result">
      <div id="resultCard" class="mx-auto max-w-3xl rounded-xl overflow-hidden border" style="background:var(--card);border-color:var(--border);"></div>
    </section>

    <section id="historySection" class="hidden" aria-label="Previously randomized movies">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-creep text-2xl" style="color:var(--accent);">Recent Terrors</h2>
        <button id="clearHistory" class="text-xs uppercase tracking-wider px-3 py-1 rounded border cursor-pointer transition-colors hover:border-red-600" style="color:var(--muted);border-color:var(--border);">Clear All</button>
      </div>
      <div id="historyList" class="grid gap-3"></div>
    </section>
  </main>

  <footer class="text-center py-6 px-4" style="color:var(--muted);">
    <div class="mx-auto w-24 h-px mb-4" style="background:linear-gradient(to right,transparent,var(--border),transparent);"></div>
    <p class="text-xs uppercase tracking-widest">You can't unwatch what you've seen</p>
  </footer>
</div>

// ─── Subgenres & Decades ───
const subgenres = [...new Set(movies.map(m => m.subgenre))].sort();
const decades = [...new Set(movies.map(m => Math.floor(m.year / 10) * 10))].sort();

// ─── State ───
let activeGenres = new Set();
let activeDecades = new Set();
let minRating = 5;
let history = [];
let isRandomizing = false;

// ─── Initialize UI ───
function init() {
  renderChips();
  updateAvailableCount();
  initFogCanvas();
  spawnBloodDrips();
  spawnParticles();
  bindEvents();
}

function renderChips() {
  const genreContainer = document.getElementById('genreChips');
  genreContainer.innerHTML = subgenres.map(g => `
    <button class="chip text-xs px-3 py-1.5 rounded-full border"
            style="border-color: var(--border); color: var(--muted);"
            data-genre="${g}" aria-pressed="false">${g}</button>
  `).join('');

  const decadeContainer = document.getElementById('decadeChips');
  decadeContainer.innerHTML = decades.map(d => `
    <button class="chip text-xs px-3 py-1.5 rounded-full border"
            style="border-color: var(--border); color: var(--muted);"
            data-decade="${d}" aria-pressed="false">${d}s</button>
  `).join('');
}

function getFilteredMovies() {
  return movies.filter(m => {
    if (activeGenres.size > 0 && !activeGenres.has(m.subgenre)) return false;
    if (activeDecades.size > 0 && !activeDecades.has(Math.floor(m.year / 10) * 10)) return false;
    if (m.rating < minRating) return false;
    return true;
  });
}

function updateAvailableCount() {
  document.getElementById('availableCount').textContent = getFilteredMovies().length;
}

function renderStars(rating) {
  const full = Math.floor(rating / 2);
  const half = rating % 2 >= 1;
  const empty = 5 - full - (half ? 1 : 0);
  let html = '';
  for (let i = 0; i < full; i++) html += '<i class="fas fa-star star-filled"></i>';
  if (half) html += '<i class="fas fa-star-half-alt star-filled"></i>';
  for (let i = 0; i < empty; i++) html += '<i class="far fa-star star-empty"></i>';
  return html;
}

function renderResultCard(movie) {
  const card = document.getElementById('resultCard');
  card.innerHTML = `
    <div class="movie-card-grid grid grid-cols-1 md:grid-cols-[240px_1fr]" style="grid-template-columns:240px 1fr;">
      <div class="relative overflow-hidden poster-shimmer" style="min-height:340px;">
        <img src="https://picsum.photos/seed/${movie.seed}/480/680.jpg"
             alt="${movie.title} poster"
             class="w-full h-full object-cover"
             loading="eager"
             style="min-height:340px;">
        <div class="absolute inset-0" style="background:linear-gradient(to right,transparent 60%,var(--card) 100%);"></div>
        <div class="absolute bottom-0 left-0 right-0 h-20" style="background:linear-gradient(to top,var(--card),transparent);"></div>
      </div>
      <div class="p-6 md:p-8 flex flex-col justify-center">
        <div class="flex items-start justify-between gap-4 mb-4">
          <h2 class="font-creep text-3xl md:text-4xl" style="color:var(--fg);">${movie.title}</h2>
          <span class="text-3xl font-bold shrink-0" style="color:var(--accent);">${movie.rating.toFixed(1)}</span>
        </div>
        <div class="flex items-center flex-wrap gap-3 mb-3 text-sm" style="color:var(--muted);">
          <span><i class="fas fa-calendar-alt mr-1"></i>${movie.year}</span>
          <span class="w-1 h-1 rounded-full" style="background:var(--border);"></span>
          <span><i class="fas fa-video mr-1"></i>${movie.director}</span>
          <span class="w-1 h-1 rounded-full" style="background:var(--border);"></span>
          <span class="px-2 py-0.5 rounded text-xs font-semibold" style="background:rgba(196,30,30,0.15);color:var(--accent);">${movie.subgenre}</span>
        </div>
        <div class="mb-4 text-sm" style="color:var(--accent);">${renderStars(movie.rating)}</div>
        <p class="text-sm leading-relaxed" style="color:var(--fg);opacity:0.8;">${movie.synopsis}</p>
        <div class="mt-6 flex gap-3">
          <button onclick="randomize()" class="text-sm px-5 py-2 rounded border cursor-pointer transition-all hover:scale-105"
                  style="border-color:var(--accent);color:var(--accent);">
            <i class="fas fa-dice mr-2"></i>Another
          </button>
          <button onclick="copyToClipboard('${movie.title} (${movie.year})')" class="text-sm px-5 py-2 rounded border cursor-pointer transition-all hover:scale-105"
                  style="border-color:var(--border);color:var(--muted);">
            <i class="fas fa-share-alt mr-2"></i>Share
          </button>
        </div>
      </div>
    </div>
  `;
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    section.classList.add('hidden');
    return;
  }
  section.classList.remove('hidden');
  list.innerHTML = history.map((m, i) => `
    <div class="history-item flex items-center gap-4 p-3 rounded-lg border" style="background:var(--card);border-color:var(--border);">
      <img src="https://picsum.photos/seed/${m.seed}/80/80.jpg" alt="" class="w-12 h-12 rounded object-cover shrink-0">
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-sm truncate" style="color:var(--fg);">${m.title}</p>
        <p class="text-xs" style="color:var(--muted);">${m.year} &middot; ${m.subgenre} &middot; ${m.rating.toFixed(1)}</p>
      </div>
      <span class="text-xs px-2 py-1 rounded" style="background:rgba(196,30,30,0.1);color:var(--accent);">#${i + 1}</span>
    </div>
  `).join('');
}

// ─── Randomize Logic ───
function randomize() {
  if (isRandomizing) return;
  const filtered = getFilteredMovies();
  if (filtered.length === 0) {
    showToast("No movies match your filters. Adjust and try again.", "warning");
    return;
  }

  isRandomizing = true;
  const btn = document.getElementById('randomizeBtn');
  const resultSection = document.getElementById('resultSection');
  const resultCard = document.getElementById('resultCard');

  btn.classList.add('glitch-active');
  document.body.classList.add('shake');

  let cycles = 0;
  const totalCycles = 18;
  const interval = setInterval(() => {
    const randomMovie = filtered[Math.floor(Math.random() * filtered.length)];
    resultSection.classList.remove('hidden');
    resultCard.innerHTML = `
      <div class="p-8 md:p-12 text-center">
        <p class="font-creep text-2xl md:text-3xl glitch-active" style="color:var(--accent);">${randomMovie.title}</p>
        <p class="text-sm mt-2" style="color:var(--muted);">${randomMovie.year}</p>
      </div>
    `;
    cycles++;
    if (cycles >= totalCycles) {
      clearInterval(interval);

      const finalMovie = filtered[Math.floor(Math.random() * filtered.length)];
      renderResultCard(finalMovie);
      resultCard.classList.remove('card-reveal');
      void resultCard.offsetWidth;
      resultCard.classList.add('card-reveal');

      history.unshift(finalMovie);
      if (history.length > 8) history.pop();
      renderHistory();

      btn.classList.remove('glitch-active');
      document.body.classList.remove('shake');
      isRandomizing = false;

      resultSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, 70 + cycles * 8);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast(`Copied "${text}" to clipboard`, "success");
  }).catch(() => {
    showToast("Failed to copy", "error");
  });
}

// ─── Toast System ───
function showToast(message, type = "info") {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  const colors = {
    success: "border-green-600 text-green-400",
    error: "border-red-600 text-red-400",
    warning: "border-yellow-600 text-yellow-400",
    info: "border-gray-500 text-gray-300"
  };
  const icons = {
    success: "fa-check-circle",
    error: "fa-exclamation-circle",
    warning: "fa-exclamation-triangle",
    info: "fa-info-circle"
  };
  toast.className = `toast-enter flex items-center gap-2 px-4 py-2 rounded-lg border text-sm ${colors[type] || colors.info}`;
  toast.style.background = "var(--card)";
  toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${message}</span>`;
  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.remove('toast-enter');
    toast.classList.add('toast-exit');
    setTimeout(() => toast.remove(), 400);
  }, 3000);
}

// ─── Fog Canvas ───
function initFogCanvas() {
  const canvas = document.getElementById('fogCanvas');
  const ctx = canvas.getContext('2d');
  let w, h;
  const blobs = [];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 6; i++) {
    blobs.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: 150 + Math.random() * 250,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.15,
      opacity: 0.015 + Math.random() * 0.02
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    blobs.forEach(b => {
      b.x += b.vx;
      b.y += b.vy;
      if (b.x < -b.r) b.x = w + b.r;
      if (b.x > w + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = h + b.r;
      if (b.y > h + b.r) b.y = -b.r;

      const safeR = Math.max(1, b.r);
      const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, safeR);
      grad.addColorStop(0, `rgba(139,0,0,${b.opacity})`);
      grad.addColorStop(0.5, `rgba(80,10,10,${b.opacity * 0.5})`);
      grad.addColorStop(1, `rgba(0,0,0,0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(b.x - safeR, b.y - safeR, safeR * 2, safeR * 2);
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// ─── Blood Drips ───
function spawnBloodDrips() {
  const container = document.getElementById('bloodDrips');
  for (let i = 0; i < 8; i++) {
    const drip = document.createElement('div');
    drip.className = 'blood-drip';
    drip.style.left = (5 + Math.random() * 90) + '%';
    drip.style.animationDelay = (Math.random() * 5) + 's';
    drip.style.animationDuration = (2 + Math.random() * 3) + 's';
    container.appendChild(drip);
  }
}

// ─── Floating Particles ───
function spawnParticles() {
  const container = document.getElementById('particles');
  function createParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.bottom = '-10px';
    const duration = 6 + Math.random() * 10;
    const size = 1 + Math.random() * 2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.animation = `float ${duration}s linear forwards`;
    container.appendChild(p);
    setTimeout(() => p.remove(), duration * 1000);
  }
  setInterval(createParticle, 800);
  for (let i = 0; i < 5; i++) setTimeout(createParticle, i * 200);
}

// ─── Event Bindings ───
function bindEvents() {
  document.getElementById('genreChips').addEventListener('click', (e) => {
    const chip = e.target.closest('[data-genre]');
    if (!chip) return;
    const genre = chip.dataset.genre;
    if (activeGenres.has(genre)) {
      activeGenres.delete(genre);
      chip.classList.remove('active');
      chip.setAttribute('aria-pressed', 'false');
    } else {
      activeGenres.add(genre);
      chip.classList.add('active');
      chip.setAttribute('aria-pressed', 'true');
    }
    updateAvailableCount();
  });

  document.getElementById('decadeChips').addEventListener('click', (e) => {
    const chip = e.target.closest('[data-decade]');
    if (!chip) return;
    const decade = parseInt(chip.dataset.decade);
    if (activeDecades.has(decade)) {
      activeDecades.delete(decade);
      chip.classList.remove('active');
      chip.setAttribute('aria-pressed', 'false');
    } else {
      activeDecades.add(decade);
      chip.classList.add('active');
      chip.setAttribute('aria-pressed', 'true');
    }
    updateAvailableCount();
  });

  const slider = document.getElementById('ratingSlider');
  const ratingDisplay = document.getElementById('ratingValue');
  slider.addEventListener('input', () => {
    minRating = parseFloat(slider.value);
    ratingDisplay.textContent = minRating.toFixed(1);
    updateAvailableCount();
  });

  document.getElementById('randomizeBtn').addEventListener('click', randomize);

  document.getElementById('clearHistory').addEventListener('click', () => {
    history = [];
    renderHistory();
    showToast("History cleared", "info");
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && document.activeElement === document.body) {
      e.preventDefault();
      randomize();
    }
  });
}

// ─── Start ───
init();
</script>
